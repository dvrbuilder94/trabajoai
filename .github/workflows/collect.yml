name: Collect public job listings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'scripts/sync_supabase.py'
      - 'data/sources.json'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public vacancies
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Sync public listings to Supabase
        if: steps.collect.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Update public jobs JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/source_health.json
          git diff --cached --quiet || (git commit -m 'data: refresh job listings' && git push)
      - name: Report collector failure
        if: steps.collect.outcome != 'success'
        run: |
          echo 'Collector failed or returned no matching jobs. Previous listings retained.' >&2
          exit 1
